<!DOCTYPE html>
<html>
<head>
  <style>

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .pdf-container {
      width: 100%;
      height: 100vh; /* 80% of viewport height - adjust as needed */
     
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="pdf-container">
    <iframe src="document.pdf" width="100%" height="100%"></iframe>
  </div>
</body>
</html>
