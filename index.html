<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      background: #fff;
    }

    .pdf-container {
      width: 100%;
      min-height: 100vh;
    }

    iframe {
      width: 100%;
      min-height: 100vh;
      border: none;
    }

    .pdf-message {
      padding: 1rem;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="pdf-container">
    <iframe src="Pain Seminar.pdf" title="Pain Seminar brochure"></iframe>
  </div>
  <div class="pdf-message">
    If your phone browser does not show the brochure correctly, <a href="Pain Seminar.pdf" target="_blank">open the PDF in a new tab</a>.
  </div>
</body>
</html>
